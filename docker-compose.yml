name: maitian

services:
  chrome-unified:
    build: ./docker/chrome
    container_name: chrome-unified
    restart: unless-stopped
    init: true
    shm_size: 2gb
    environment:
      TZ: Asia/Shanghai
      PLAYWRITER_TOKEN: ${PLAYWRITER_TOKEN:-maitian-local}
    volumes:
      - chrome-profile:/chrome-profile
    ports:
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:19988:19988"
      - "${MAITIAN_WEB_PORT:-8789}:8789"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  playwriter-relay:
    image: node:22-bookworm-slim
    container_name: playwriter-relay
    restart: unless-stopped
    depends_on:
      chrome-unified:
        condition: service_healthy
    network_mode: "service:chrome-unified"
    environment:
      TZ: Asia/Shanghai
    command:
      - /bin/sh
      - -c
      - exec npx -y playwriter@0.12.0 serve --host 0.0.0.0 --port 19988 --token "$PLAYWRITER_TOKEN"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: 3

  maitian:
    build: .
    container_name: maitian
    restart: unless-stopped
    depends_on:
      chrome-unified:
        condition: service_healthy
    network_mode: "service:chrome-unified"
    environment:
      TZ: Asia/Shanghai
      MAITIAN_CONFIG: /data/maitian/config.json
      MAITIAN_DB: /data/maitian/hub.db
      CHROME_PROFILE: /data/chrome-profile
      CDP_URL: http://127.0.0.1:9222
      MAITIAN_WEB_PORT: ${MAITIAN_WEB_PORT:-8789}
      MAITIAN_WEB_KEY: ${MAITIAN_WEB_KEY:-maitian-8789-local-20261119}
      DTK_BASE: ${DTK_BASE:-http://192.168.123.11:8000}
      DTK_API_KEY: ${DTK_API_KEY:-maitian-dtk-local-20261119}
    volumes:
      - ./config.json:/data/maitian/config.example.json:ro
      - maitian-data:/data/maitian
      - chrome-profile:/data/chrome-profile:ro
      - ${MAITIAN_PROJECTS:-./projects}:/data/projects:rw
    command:
      - /bin/sh
      - -c
      - node scripts/prepare-config.mjs /data/maitian/config.example.json /data/maitian/config.json && exec node src/hub.mjs daemon
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: 3

volumes:
  chrome-profile:
    name: maitian-chrome-profile
  maitian-data:
    name: maitian-data
